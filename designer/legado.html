<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feegow · Transição — Configurações de Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/symbol-feegow-primary.svg">
<meta name="ext-resource-dependency" content="assets/symbol-feegow-primary.svg" data-resource-id="feegowSymbol" />
<meta name="ext-resource-dependency" content="assets/icon-doctoralia.png" data-resource-id="doctoIcon" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#f4f6f9;font-family:"InterVariable","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b3440;-webkit-font-smoothing:antialiased}
  #root{height:100%}
  button,input,select{font-family:inherit}
  a{color:#006a59}a:hover{color:#025b4c}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#d2d6d6;border-radius:999px;border:3px solid #fff}
  ::-webkit-scrollbar-thumb:hover{background:#afb4b4}
  ::-webkit-scrollbar-track{background:transparent}
  [data-lucide]{display:inline-flex}
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="16" fill="#006a59"/>
      <rect x="26" y="30" width="48" height="10" rx="5" fill="#ffffff"/>
      <rect x="26" y="46" width="48" height="10" rx="5" fill="#dff9f2"/>
      <rect x="26" y="62" width="30" height="10" rx="5" fill="#fff6ba"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script type="text/babel" src="transicao/legacy-shell.jsx"></script>
  <script type="text/babel" src="transicao/legacy-settings.jsx"></script>

  <script type="text/babel">
    function TransitionApp() {
      const [page, setPage] = React.useState('agenda');
      const [cfg, setCfgState] = React.useState(lcfgLoad);
      const [toast, setToast] = React.useState(null);
      const flash = msg => { setToast(msg); clearTimeout(window.__lt); window.__lt = setTimeout(() => setToast(null), 2600); };
      const setCfg = patch => setCfgState(c => { const n = { ...c, ...patch }; lcfgSave(n); flash('Configuração salva'); return n; });
      const resetSection = keys => setCfgState(c => {
        const n = { ...c };
        keys.forEach(k => { n[k] = LCFG_DEFAULTS[k]; if (k === 'statusAutomatico') n.statusAutomaticoPara = LCFG_DEFAULTS.statusAutomaticoPara; });
        lcfgSave(n); flash('Seção restaurada para o padrão'); return n;
      });
      return (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: LT.bg }}>
          <LegacyTopbar onPick={id => { if (id === 'config') setPage('config'); }} />
          <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
            <LegacySidebar />
            {page === 'config'
              ? <LegacyConfigPage cfg={cfg} setCfg={setCfg} resetSection={resetSection} onBack={() => setPage('agenda')} />
              : <LegacyAgendaGrid />}
          </div>
          <LToast msg={toast} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<TransitionApp />);
  </script>
</body>
</html>
