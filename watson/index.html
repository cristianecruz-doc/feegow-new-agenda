<style>
  @font-face { font-family: "InterVariable"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "InterVariable"; src: url("assets/fonts/InterVariable-Italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f7f8f8; font-family: "InterVariable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-weight: 450; font-size: 14px; line-height: 1.5; color: #242727; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100%; }
  button, input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #d8dada; border-radius: 999px; border: 3px solid #ffffff; }
  ::-webkit-scrollbar-thumb:hover { background: #afb4b4; }
  ::-webkit-scrollbar-track { background: transparent; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  @keyframes wtoast { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes drawerIn { from { transform: translateX(24px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(40px); } to { transform: translateY(0); } }
  @keyframes modalIn { from { transform: scale(.97); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid #00a085; outline-offset: 2px; }
  @media (max-width: 991px) { html, body { font-size: 16px; } }

  /* ---- FullCalendar × Watson (customer / web / light) ---------------------- */
  .na-fc { --fc-border-color: #e8eaea; --fc-page-bg-color: #ffffff; --fc-neutral-bg-color: #f3f5f5; --fc-non-business-color: #f3f5f5;
    --fc-today-bg-color: transparent; --fc-now-indicator-color: #ae2f25; --fc-highlight-color: #dff9f2; --fc-event-border-color: transparent;
    --fc-event-bg-color: transparent; --fc-event-text-color: #242727; --fc-bg-event-opacity: 1; --fc-small-font-size: 12px;
    --fc-list-event-hover-bg-color: #e8eaea99; --na-row: 60px; font-family: "InterVariable",system-ui,sans-serif; }
  .na-fc .fc { font-size: 14px; }
  .na-fc .fc-timegrid-slot { height: var(--na-row); }
  .na-fc .fc-timegrid-slot-minor { border-top-style: dashed; }
  .na-fc .fc-timegrid-slot-label { vertical-align: top; border-top-color: transparent; }
  .na-fc .na-slot-label { display: inline-block; font-size: 12px; font-weight: 450; color: #888f8f; font-variant-numeric: tabular-nums; padding-top: 4px; }
  .na-fc .fc-timegrid-axis-cushion, .na-fc .fc-timegrid-slot-label-cushion { padding: 0 8px; }
  .na-fc .fc-timegrid-body { margin-top: 24px; } /* room for the grade label tab above the first slot */
  .na-fc .fc-scrollgrid { border-left: 0; border-right: 0; }
  .na-fc .fc-col-header-cell { background: #ffffff; vertical-align: top; }
  .na-fc .fc-col-header-cell-cushion { display: block; padding: 0; color: inherit; text-decoration: none; }
  .na-fc .fc-datagrid-cell-cushion, .na-fc .fc-col-header-cell .fc-scrollgrid-sync-inner { padding: 0; }
  .na-fc .fc-timegrid-col-events { margin: 0 16px 0 2px; } /* 1rem right gutter = fit-in click zone (production) */
  .na-fc .fc-v-event, .na-fc .fc-timegrid-event { background: transparent; border: 0; box-shadow: none; }
  .na-fc .fc-timegrid-event-harness-inset .fc-timegrid-event { box-shadow: none; }
  .na-fc .fc-timegrid-event .fc-event-main { padding: 0 0 2px 0; height: 100%; }
  .na-fc .fc-event-main > .na-fc-node, .na-fc .fc-bg-event > .na-fc-node, .na-fc .na-fc-node { height: 100%; }
  .na-fc .fc-timegrid-event-harness { padding-top: 1px; }
  .na-fc .fc-bg-event { opacity: 1; background: transparent; }
  .na-fc .fc-bg-event.na-bg-grade { pointer-events: none; overflow: visible; z-index: 5 !important; }
  .na-fc .fc-timegrid-bg-harness:has(.na-bg-grade) { overflow: visible; }
  .na-fc .na-bg-interval, .na-fc .na-bg-block, .na-fc .na-bg-free, .na-fc .na-bg-off { padding: 1px 2px 2px; box-sizing: border-box; }
  .na-fc .fc-bg-event.na-bg-block, .na-fc .fc-bg-event.na-bg-free { pointer-events: auto; z-index: 3 !important; }
  .na-fc .fc-timegrid-now-indicator-line { border-width: 2px 0 0; }
  .na-fc .fc-timegrid-now-indicator-arrow { border-color: #ae2f25; border-top-color: transparent; border-bottom-color: transparent; }
  .na-fc .fc-highlight { background: #dff9f2; }
  .na-fc .fc-event-mirror { opacity: 1; }
  .na-fc .fc-timegrid-event-harness:has(.fc-event-dragging) { opacity: .6; }
  /* month (dayGrid) */
  .na-fc-simple .fc-daygrid-day-frame { min-height: 104px; }
  .na-fc-simple .fc-daygrid-day-top { display: block; }
  .na-fc-simple .fc-daygrid-day-number { display: block; padding: 0; width: 100%; color: inherit; text-decoration: none; }
  .na-fc-simple .fc-daygrid-day:hover { background: #e8eaea99; cursor: pointer; }
  .na-fc-simple .fc-day-disabled { background: #f3f5f5; }
  .na-fc-simple .fc-scrollgrid { border-radius: 16px; overflow: hidden; border: 1px solid #d8dada; background: #ffffff; }
  .na-fc-simple .fc-col-header-cell { padding: 8px; }
  /* list */
  .na-fc-simple .fc-list { border: 0; }
  .na-fc-simple .fc-list-day-cushion { background: #ffffff; padding: 0; }
  .na-fc-simple .fc-list-event-time, .na-fc-simple .fc-list-event-graphic { display: none; }
  .na-fc-simple .fc-list-event td { border-color: #e8eaea; padding: 0 8px; }
  .na-fc-simple .fc-list-day > th { border-color: #e8eaea; }
  .na-fc-simple .fc-list-empty { background: #ffffff; }
  @media print {
    body * { visibility: hidden !important; }
    [data-print-area], [data-print-area] * { visibility: visible !important; }
    [data-print-area] { position: absolute !important; left: 0; top: 0; width: 100%; height: auto !important; overflow: visible !important; padding: 0 !important; }
    [data-print-only] { display: block !important; }
    @page { margin: 16mm; }
  }
</style>
